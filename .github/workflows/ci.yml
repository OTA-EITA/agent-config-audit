name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          # Always use the newest 24.x, not the runner's cached (possibly unpatched) Node.
          check-latest: true
          cache: npm
      # Install scripts of dependencies never run; none of them need one.
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate
      - run: npm audit signatures
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run coverage
      - name: dist is up to date
        run: |
          npm run build
          git diff --exit-code dist/ || (echo "::error::dist/ is stale; run npm run build and commit" && exit 1)
      - name: the packaged CLI runs through a bin symlink
        # Unpacks the tarball instead of npm install -g, and links the bin the way npm does.
        run: |
          npm pack
          mkdir -p "$RUNNER_TEMP/pkg" "$RUNNER_TEMP/bin"
          tar xzf agent-config-audit-*.tgz -C "$RUNNER_TEMP/pkg"
          chmod +x "$RUNNER_TEMP/pkg/package/dist/cli.js"
          ln -s "$RUNNER_TEMP/pkg/package/dist/cli.js" "$RUNNER_TEMP/bin/agent-config-audit"
          "$RUNNER_TEMP/bin/agent-config-audit" --version | grep -q '^agent-config-audit '
          "$RUNNER_TEMP/bin/agent-config-audit" --fail-on none test/fixtures/repo | grep -q 'AC001'
          rm agent-config-audit-*.tgz

  action:
    # The committed action must pass the clean config and fail on the planted problems.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./
        with:
          path: test/fixtures/clean
          fail-on: low
      - uses: ./
        id: bad
        continue-on-error: true
        with:
          path: test/fixtures/repo
      - name: the risky fixture failed with findings
        env:
          OUTCOME: ${{ steps.bad.outcome }}
          FINDINGS: ${{ steps.bad.outputs.findings }}
        run: |
          test "$OUTCOME" = failure
          test "$FINDINGS" -eq 15

  lockfile-guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: OTA-EITA/lockfile-guard@55ee3a46240c2f24b4171787944f541d89834521 # v0.1.1
        id: guard
        with:
          fail-on: medium
          # Reviewed: esbuild only verifies its platform binary, fsevents builds a macOS addon.
          allow-scripts: esbuild,fsevents
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        if: always()
        with:
          sarif_file: ${{ steps.guard.outputs.sarif-file }}
          category: lockfile-guard

  gha-guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: OTA-EITA/gha-guard@c093554564f6b30b409a29e7f395e8f45755b9ba # v0.2.0
        id: guard
        with:
          fail-on: low
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        if: always()
        with:
          sarif_file: ${{ steps.guard.outputs.sarif-file }}
          category: gha-guard
